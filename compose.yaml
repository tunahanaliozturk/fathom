# Local stack: Postgres with pgvector, a one-shot migration, the API, one indexer, a one-shot seed of the demo corpus,
# and the browser console in front of the API.
# The password below is for this laptop stack only. API keys are created with `fathom keys create` (see README); the
# console's proxy gets its own read-only key from the seed step and nothing is committed (ADR 8).
name: fathom

x-fathom: &fathom
  image: fathom:local
  environment:
    FATHOM_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fathom

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fathom
    volumes:
      - postgres:/var/lib/postgresql
    ports: ["127.0.0.1:55435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fathom"]
      interval: 2s
      retries: 30

  migrate:
    <<: *fathom
    build: .
    command: ["migrate"]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *fathom
    ports: ["127.0.0.1:8300:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 3s
      retries: 30

  indexer:
    <<: *fathom
    command: ["indexer"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  # One shot (tools/seed.py): creates the proxy's read key, sends the demo corpus through the API, and exits once the
  # indexer has embedded all of it. The corpus is the repository's own markdown plus corpus/ (ADR 9).
  seed:
    <<: *fathom
    entrypoint: ["python", "/seed/seed.py"]
    volumes:
      - ./tools/seed.py:/seed/seed.py:ro
      - ./README.md:/corpus/README.md:ro
      - ./CHANGELOG.md:/corpus/CHANGELOG.md:ro
      - ./CONTRIBUTING.md:/corpus/CONTRIBUTING.md:ro
      - ./SECURITY.md:/corpus/SECURITY.md:ro
      - ./docs:/corpus/docs:ro
      - ./corpus:/corpus/corpus:ro
      - web-key:/var/lib/fathom
    depends_on:
      api: {condition: service_healthy}
      indexer: {condition: service_started}

  # The console, and the one origin a browser talks to. nginx serves the built page and proxies two routes of one
  # collection to the API, adding the read key the seed step left in the shared volume (web/nginx.conf).
  web:
    build: ./web
    image: fathom-web:local
    ports: ["127.0.0.1:8340:8080"]
    volumes:
      - web-key:/run/fathom:ro
    depends_on:
      api: {condition: service_healthy}
      seed: {condition: service_completed_successfully}
    healthcheck:
      # Through the proxy, so healthy means the key was accepted and a search from the page will work.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/collections/demo/stats"]
      interval: 5s
      retries: 12

volumes:
  postgres:
  web-key:
