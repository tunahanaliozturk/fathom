# The headers every response from this origin carries, errors included (`always`).
#
# nginx applies the `add_header` lines of the innermost block that has any and ignores the ones above it. A location
# that sets one header of its own (a cache lifetime, Retry-After) would silently drop these three, so every such
# location includes this file, and so does the server block for the locations that set nothing.
# web/e2e/proxy.spec.ts asks for each kind of answer and checks.

# No inline script or style is needed, so none is allowed. A snippet that got past the page's escaping could still
# not run anything.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
# The query is in the page's address. With this, the address is not sent on as a Referer, to this server or any other.
add_header Referrer-Policy "no-referrer" always;
