# The console's one origin: the built page, and two routes of one collection of the API behind it (ADR 8).
#
# Anyone who can reach this port can search the demo collection without a credential, because the proxy adds one.
# So the proxy is the access policy: it forwards exactly two routes, for exactly one collection, with a key that can
# only read that collection, and it limits how fast one address may ask.

# Per client address, as nginx sees it. Behind Docker Desktop's port forward, or any other proxy that does not pass the
# real address on, every client shares one bucket (ADR 8 says what a real deployment changes).
limit_req_zone $binary_remote_addr zone=search:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=stats:1m rate=2r/s;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # No inline script or style is needed, so none is allowed. A snippet that got past the page's escaping could still
  # not run anything.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # Docker's own DNS, asked again every 10 seconds: with a variable in proxy_pass nginx resolves the name per request
  # instead of once at start, so a restarted API container with a new address is found again.
  resolver 127.0.0.11 valid=10s;
  set $api http://api:8000;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The allowlist. `location =` matches one exact path, so there is no prefix, pattern or trailing segment to slip
  # through, and the path sent upstream is written out here rather than taken from the request.
  location = /api/v1/collections/demo/search {
    error_page 404 @refused;
    error_page 429 @limited;
    error_page 502 504 @unavailable;
    if ($request_method != POST) {
      return 404;
    }
    limit_req zone=search burst=30 nodelay;
    proxy_pass $api/v1/collections/demo/search;
    include /etc/nginx/fathom-proxy.conf;
  }

  location = /api/v1/collections/demo/stats {
    error_page 404 @refused;
    error_page 429 @limited;
    error_page 502 504 @unavailable;
    if ($request_method != GET) {
      return 404;
    }
    limit_req zone=stats burst=10 nodelay;
    proxy_pass $api/v1/collections/demo/stats;
    include /etc/nginx/fathom-proxy.conf;
  }

  # Everything else under the prefix: other collections, documents, the OpenAPI document, the health routes.
  location /api/ {
    error_page 404 @refused;
    return 404;
  }

  # The proxy's own refusals, in the shape the API uses for its errors (RFC 9457), so the page shows them the same way.
  # The empty `types` block makes the type below apply whatever extension the refused path ended in.
  location @refused {
    types { }
    default_type application/problem+json;
    add_header X-Content-Type-Options "nosniff" always;
    return 404 '{"type":"about:blank","title":"Not found","status":404,"detail":"this origin serves search and stats for one collection"}';
  }

  location @limited {
    types { }
    default_type application/problem+json;
    add_header Retry-After "1" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 429 '{"type":"about:blank","title":"Too many requests","status":429,"detail":"one address may send 10 searches a second"}';
  }

  location @unavailable {
    types { }
    default_type application/problem+json;
    add_header X-Content-Type-Options "nosniff" always;
    return 503 '{"type":"about:blank","title":"Search service unavailable","status":503,"detail":"the API did not answer the proxy"}';
  }

  # Vite names every asset after its content, so a name never means two things.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri /index.html;
  }
}
