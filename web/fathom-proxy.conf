# Shared by the two proxied routes in nginx.conf.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";

# The credential. read-key.sh writes this one line at container start from the key the seed step left in the shared
# volume. It sets the Authorization header, so whatever a browser sent under that name is replaced, never forwarded.
include /tmp/fathom-key.conf;

# A search request is a query of at most 1,000 characters and three small fields.
client_max_body_size 8k;
proxy_connect_timeout 3s;
proxy_read_timeout 15s;
